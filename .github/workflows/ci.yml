name: DOM Crossfire checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    # Pinned: ubuntu-latest is moving to 26.04, which Playwright 1.58 does not support yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # vendor/fizlet is a committed snapshot (npm run sync); CI builds and checks what is in the repo.
      - run: npm run check
      - run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length) { console.error('DOM Crossfire ships no runtime dependencies'); process.exit(1) }"
      - run: npx playwright install --with-deps chromium
      # The step allocates nothing (0 minor GCs in 20,000 steps), a seed replays its match, and each
      # army plays like its own game.
      - run: npm test
      - run: npm run test:settle
      # The landing, the start screen, a match, pause, a win, the drop-in; then phones (game mode).
      - run: npm run test:browser
      # Squad play: 2-4 people in lockstep (in memory, then through the squad page on a stand-in room server).
      - run: npm run test:squad
  # When package.json's version changes on main, tag it v<version> (never moves an existing tag).
  tag-version:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          tag="v$(node -p 'require("./package.json").version')"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then exit 0; fi
          git tag "$tag"
          git push origin "$tag"
